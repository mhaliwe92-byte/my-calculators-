<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حاسبة الطرد</title><style>*{box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;background:#f3f6fa;margin:0;padding:10px;color:#152238}main{max-width:520px;margin:auto}h2{text-align:center;font-size:19px;margin:9px 0 12px}section{background:#fff;border-radius:13px;padding:12px;margin:9px 0;box-shadow:0 1px 7px #0001}.fields{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{min-width:0}label{display:block;font-size:12px;margin-bottom:4px;font-weight:650;line-height:1.35}input{width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:8px;font-size:16px;min-width:0}small{color:#596579;font-size:11px;display:block;margin:6px 0}.result{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eef0f3;padding:7px 0;gap:8px;font-size:13px}.result strong{direction:ltr;white-space:nowrap;font-size:14px}.result:first-child,.result:last-child{background:#edf6ff;border-radius:7px;padding:9px 7px;font-weight:700}.result:last-child{background:#edf9f0;color:#176b39}.result:last-child strong{font-size:19px}button{border:0;background:#174c88;color:white;border-radius:8px;padding:9px;width:100%;font-size:13px;margin-top:8px}.subhead{font-size:13px;font-weight:700;margin:9px 0 7px}.dims{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}</style></head><body><main><h2>📦 حاسبة تكلفة وربح الطرد</h2><section><div class="fields"><div class="field"><label for="price">سعر القطعة (رمبي)</label><input id="price" type="number" step="any" value="25.7"></div><div class="field"><label for="qty">عدد القطع بالطرد</label><input id="qty" type="number" step="1" value="24"></div><div class="field"><label for="rate">سعر الدولار (رمبي)</label><input id="rate" type="number" step="any" value="6.7"></div><div class="field"><label for="freight">شحن وجمرك ($/م³)</label><input id="freight" type="number" step="any" value="150"></div><div class="field"><label for="profit">الربح فوق التكلفة (%)</label><input id="profit" type="number" step="any" value="40"></div><div class="field"><label for="cbm">حجم الطرد CBM</label><input id="cbm" type="number" step="any" value="0.242"></div></div><div class="subhead">أو احسب حجم الطرد من الأبعاد (سم)</div><div class="dims"><div><label for="l">الطول</label><input id="l" type="number" step="any" placeholder="سم"></div><div><label for="w">العرض</label><input id="w" type="number" step="any" placeholder="سم"></div><div><label for="h">الارتفاع</label><input id="h" type="number" step="any" placeholder="سم"></div></div><button id="dims">استخدم الأبعاد لحساب الحجم</button></section><section id="out"></section><small>الربح محسوب كنسبة زيادة على التكلفة، وليس هامشاً من سعر البيع. لا تشمل الحسابات مصاريف إضافية غير المدخلة.</small></main><script>const ids=['price','qty','rate','freight','profit','cbm','l','w','h'];const $=id=>document.getElementById(id);let fmt=n=>Number.isFinite(n)?n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):'—';function calc(){let v=id=>parseFloat($(id).value)||0,p=v('price'),q=v('qty'),r=v('rate'),f=v('freight'),m=v('profit')/100,c=v('cbm');let purchase=r>0?p*q/r:NaN,ship=c*f,total=purchase+ship,sell=total*(1+m),gain=sell-total;let data=[['عدد الطرود في المتر المكعب',c>0?fmt(1/c):'—'],['حجم الطرد (م³)',c.toFixed(4)],['ثمن شراء الطرد ($)',fmt(purchase)],['الشحن والجمرك للطرد ($)',fmt(ship)],['التكلفة النهائية للقطعة ($)',fmt(total/q)],['سعر بيع القطعة ($)',fmt(sell/q)],['سعر الطرد النهائي / التكلفة ($)',fmt(total)],['سعر بيع الطرد ($)',fmt(sell)],['ربح الطرد النهائي ($)',fmt(gain)],['ربح المتر المكعب ($/م³)',c>0?fmt(gain/c):'—']];$('out').innerHTML=data.map(([a,b])=>`<div class="result"><span>${a}</span><strong>${b}</strong></div>`).join('');ids.forEach(id=>localStorage.setItem('calc_'+id,$(id).value))}ids.forEach(id=>{let old=localStorage.getItem('calc_'+id);if(old!==null)$(id).value=old;$(id).addEventListener('input',calc)});$('dims').onclick=()=>{if(['l','w','h'].every(id=>parseFloat($(id).value)>0)){$('cbm').value=(parseFloat($('l').value)*parseFloat($('w').value)*parseFloat($('h').value)/1000000).toFixed(6);calc()}else alert('أدخل الطول والعرض والارتفاع أولاً')};calc();</script></body></html>
